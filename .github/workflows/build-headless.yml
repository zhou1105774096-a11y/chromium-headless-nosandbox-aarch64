name: Build Chromium headless-shell (no sandbox, aarch64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-headless-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk & memory
        run: |
          nproc
          free -h
          df -h / | tail -1

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git python3 ninja-build curl unzip binutils-aarch64-linux-gnu ccache

      - name: ccache restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/ccache
            /opt/src/out
          # restore 用前缀匹配最近一次保存; save 用唯一 key(见下)
          key: ccache-main-${{ github.run_id }}
          restore-keys: |
            ccache-main-

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          echo "/opt/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          cd /opt
          export PATH="/opt/depot_tools:$PATH"
          python3 /opt/depot_tools/update_depot_tools --no-bootstrap 2>/dev/null || true
          /opt/depot_tools/ensure_bootstrap 2>/dev/null || true
          # fetch chromium with no history to save disk
          fetch --nohooks --no-history chromium
          cd src
          # 跑 hooks 生成版本文件 (LASTCHANGE/DAWN_VERSION 等, --nohooks 跳过了)
          gclient sync -D --with_branch_heads
          gclient runhooks 2>/dev/null || true
        env:
          DEPOT_TOOLS_UPDATE: "0"

      - name: Configure gn (headless shell, cross-compile aarch64)
        working-directory: /opt/src
        run: |
          export PATH="/opt/depot_tools:$PATH"
          ls /opt/depot_tools/python3_bin_reldir.txt 2>/dev/null || /opt/depot_tools/ensure_bootstrap
          # 生成 LASTCHANGE.committime (fetch --nohooks 跳过了, gn 需要)
          # compute_build_timestamp.py 读 build/util/LASTCHANGE.committime
          cd build/util
          python3 lastchange.py -o LASTCHANGE
          cat LASTCHANGE
          ls -la LASTCHANGE.committime
          cd /opt/src
          # 确认路径
          ls -la build/util/LASTCHANGE.committime
          # 安装 aarch64 sysroot
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          # PATCH: 缩小 PartitionAlloc pool + 关闭 caged heap
          cp $GITHUB_WORKSPACE/patch.sh ./patch.sh && chmod +x ./patch.sh && ./patch.sh
          # 修复 v8 snapshot 交叉编译崩溃 (军师 2026-08-13 探讨结论):
          #   上次 [27844/43718] 处 mksnapshot 生成 embedded.S 时 SIGTRAP(-5)。
          #   根因: v8_enable_pointer_compression=true 要求 4GB aligned cage,
          #   mksnapshot 初始化 V8 isolate 时 mmap 失败触发 CHECK → __builtin_trap。
          # 修复:
          #   1. v8_enable_pointer_compression=false  (去 4GB aligned cage 需求, 关键)
          #   2. v8_use_external_startup_data=true   (snapshot_blob.bin 外置, 默认值)
          # 产物: headless_shell + icudtl.dat + snapshot_blob.bin 三件套部署。
          # 备选(若仍崩): v8_use_snapshot=false 完全跳过 snapshot 生成(启动变慢)。
          gn gen out/headless --args='target_os="linux" target_cpu="arm64" is_debug=false is_official_build=false v8_enable_sandbox=false v8_enable_pointer_compression=false cppgc_enable_caged_heap=false use_allocator_shim=true symbol_level=0 blink_symbol_level=0 v8_symbol_level=0 enable_nacl=false use_thin_lto=false dcheck_always_on=false cc_wrapper="ccache" use_ozone=true ozone_auto_platforms=false ozone_platform="headless" ozone_platform_headless=true headless_use_embedded_resources=true headless_enable_commands=false headless_use_prefs=false use_bundled_fontconfig=true icu_use_data_file=false use_alsa=false use_bluez=false use_cups=false use_dbus=false'

      - name: Build headless_shell
        working-directory: /opt/src
        continue-on-error: true
        env:
          CCACHE_DIR: /opt/ccache
          CCACHE_MAXSIZE: "10G"
        run: |
          export PATH="/opt/depot_tools:$PATH"
          ccache -M 10G
          ccache -s
          # 关键: GitHub 6h workflow 超时取消会跳过所有后续步骤(ccache 丢失)。
          # 用 timeout -s KILL 5h50m 强杀 ninja → 返回124 → 步骤标记失败(continue-on-error
          # 继续执行), 独立的 ccache save 步骤随后保存进度。下轮 restore 命中后续跑。
          timeout -s KILL 350m ninja -C out/headless headless_shell || true
          ccache -s
          echo "ccache hit rate above"

      - name: ccache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/ccache
            /opt/src/out
          key: ccache-main-${{ github.run_id }}

      - name: Verify binary
        working-directory: /opt/src
        run: |
          file out/headless/headless_shell
          ls -lh out/headless/headless_shell
          ls -lh out/headless/icudtl.dat out/headless/snapshot_blob.bin 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-headless-nosandbox-aarch64
          path: |
            /opt/src/out/headless/headless_shell
            /opt/src/out/headless/icudtl.dat
            /opt/src/out/headless/snapshot_blob.bin
          if-no-files-found: warn
          retention-days: 7
