name: Build Chromium headless-shell (no sandbox, aarch64)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-headless-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check disk & memory
        run: |
          nproc
          free -h
          df -h / | tail -1

      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git python3 ninja-build curl unzip binutils-aarch64-linux-gnu ccache

      - name: ccache restore
        uses: actions/cache/restore@v4
        with:
          path: /opt/ccache
          # 只缓存 ccache 命中缓存; 不缓存 out (30-60GB 塞不进 GitHub cache, 之前是核心 bug)
          key: ccache-main-latest
          restore-keys: |
            ccache-main-

      - name: Fetch depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git /opt/depot_tools
          echo "/opt/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium source
        run: |
          cd /opt
          export PATH="/opt/depot_tools:$PATH"
          python3 /opt/depot_tools/update_depot_tools --no-bootstrap 2>/dev/null || true
          /opt/depot_tools/ensure_bootstrap 2>/dev/null || true
          # fetch chromium with no history to save disk
          fetch --nohooks --no-history chromium
          cd src
          # 跑 hooks 生成版本文件 (LASTCHANGE/DAWN_VERSION 等, --nohooks 跳过了)
          gclient sync -D --with_branch_heads
          gclient runhooks 2>/dev/null || true
        env:
          DEPOT_TOOLS_UPDATE: "0"

      - name: Configure gn (headless shell, cross-compile aarch64)
        working-directory: /opt/src
        run: |
          export PATH="/opt/depot_tools:$PATH"
          ls /opt/depot_tools/python3_bin_reldir.txt 2>/dev/null || /opt/depot_tools/ensure_bootstrap
          cd build/util
          python3 lastchange.py -o LASTCHANGE
          cat LASTCHANGE
          ls -la LASTCHANGE.committime
          cd /opt/src
          ls -la build/util/LASTCHANGE.committime
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          cp $GITHUB_WORKSPACE/patch.sh ./patch.sh && chmod +x ./patch.sh && ./patch.sh
          # 用官方 headless.gn 为基础 + 追加交叉编译/裁剪参数 (军师探讨结论: headless.gn 才是 headless 正确起点)
          mkdir -p out/headless
          printf '%s\n' \
            'import("//build/args/headless.gn")' \
            '' \
            'target_os="linux"' \
            'target_cpu="arm64"' \
            'is_debug=false' \
            'is_official_build=true' \
            'v8_enable_sandbox=false' \
            'v8_enable_pointer_compression=false' \
            'cppgc_enable_caged_heap=false' \
            'use_allocator_shim=true' \
            'symbol_level=0' \
            'blink_symbol_level=0' \
            'v8_symbol_level=0' \
            'enable_nacl=false' \
            'use_thin_lto=false' \
            'use_lld=true' \
            'dcheck_always_on=false' \
            'chrome_pgo_phase=0' \
            'cc_wrapper="ccache"' > out/headless/args.gn
          gn gen out/headless
          echo "======== 诊断: 真实依赖闭包 ========"
          echo "可执行 target:"
          gn ls out/headless --type=executable 2>/dev/null || true
          echo "headless_shell 依赖闭包 target 数 (ninja -t query):"
          ninja -C out/headless -t query headless_shell 2>/dev/null | grep -c "input:" || true
          echo "total ninja targets:"
          ninja -C out/headless -t targets all 2>/dev/null | wc -l || true
          echo "======== 诊断结束 ========"

      - name: Build headless_shell
        working-directory: /opt/src
        continue-on-error: true
        env:
          CCACHE_DIR: /opt/ccache
          CCACHE_MAXSIZE: "5G"
        run: |
          export PATH="/opt/depot_tools:$PATH"
          ccache -M 5G
          ccache -s
          # 关键: GitHub 6h workflow 超时取消会跳过所有后续步骤(ccache 丢失)。
          # 用 timeout -s KILL 5h20m 强杀 ninja(留40m给ccache save, 避免GitHub 6h先到) → 返回124 → 步骤标记失败(continue-on-error
          # 继续执行), 独立的 ccache save 步骤随后保存进度。下轮 restore 命中后续跑。
          timeout -s KILL 320m ninja -C out/headless headless_shell || true
          ccache -s
          echo "ccache hit rate above"

      - name: ccache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /opt/ccache
          key: ccache-main-latest

      - name: Verify binary
        working-directory: /opt/src
        run: |
          file out/headless/headless_shell
          ls -lh out/headless/headless_shell
          ls -lh out/headless/icudtl.dat out/headless/snapshot_blob.bin 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-headless-nosandbox-aarch64
          path: |
            /opt/src/out/headless/headless_shell
            /opt/src/out/headless/icudtl.dat
            /opt/src/out/headless/snapshot_blob.bin
          if-no-files-found: warn
          retention-days: 7
